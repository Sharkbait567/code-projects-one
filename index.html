<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>code-projects-one</title>
<style>
  :root { --bg:#0d0d0d; --fg:#e8e8e8; --accent:#c8f5c0; --muted:#8a8a8a; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .box { text-align:center; padding:2rem; }
  h1 { color:var(--accent); font-size:1.6rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.25rem 0 1.5rem; }
  a {
    display:inline-block; color:var(--bg); background:var(--accent);
    text-decoration:none; font-weight:600; padding:.6rem 1.2rem; border-radius:8px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>code-projects-one</h1>
    <p>Interactive charts published from Claude sessions.</p>
    <a href="charts/">Open the chart index &rarr;</a>
  </div>
</body>
</html>
